<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Millonarios vs Nacional EN VIVO</title>

<link rel="icon" href="EJEMPLO LOGO 2 (2).png">

<style>
body{margin:0;font-family:Arial;background:#0b0f19;color:white;text-align:center}
header{background:#111a33;padding:18px;font-size:24px;font-weight:900}
.container{max-width:1000px;margin:auto;padding:20px}

.banner{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover}

.proxima{
position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,.65);
padding:15px 25px;
font-size:28px;font-weight:900;border-radius:12px}

.logo{
position:absolute;top:15px;left:15px;
background:rgba(0,0,0,.6);
padding:10px;border-radius:10px}

.logo img{width:60px}

.tag{
position:absolute;top:15px;right:15px;
background:red;padding:8px 12px;
border-radius:10px;font-weight:bold}

.card{margin-top:20px;background:#111a33;padding:20px;border-radius:12px}

.player{margin-top:20px;aspect-ratio:16/9;display:none}
.player iframe{width:100%;height:100%;border:0}

.countdown{font-size:20px;font-weight:bold}
</style>

</head>

<body>

<header>
EL DESMARQUE DEL FÚTBOL
</header>

<div class="container">

<h1>Millonarios vs Nacional EN VIVO</h1>

<div class="banner">

<img src="ESTADIO MILLONARIOS 1.JPG">

<div class="proxima">PRÓXIMA TRANSMISIÓN</div>

<div class="logo">
<img src="EJEMPLO LOGO 2 (2).png">
</div>

<div class="tag">
HOY • 8:30 PM
</div>

</div>

<div class="card">

<p>🕕 Partido: <b>8:30 PM</b></p>
<p>🎙️ Transmisión: <b>7:30 PM</b></p>

<div id="countdown" class="countdown"></div>

</div>

<div id="player" class="player">

<iframe
src="https://www.facebook.com/plugins/video.php?href=LINK_FACEBOOK_AQUI&show_text=false&autoplay=true"
allowfullscreen
allow="autoplay; encrypted-media; picture-in-picture">
</iframe>

</div>

</div>

<script>

const liveDate=new Date("2026-03-17T19:30:00-05:00").getTime();

const countdown=document.getElementById("countdown");
const player=document.getElementById("player");

function updateCountdown(){

const now=new Date().getTime();
const distance=liveDate-now;

if(distance<=0){
player.style.display="block";
countdown.innerHTML="TRANSMISIÓN EN VIVO";
return;
}

const h=Math.floor(distance/(1000*60*60));
const m=Math.floor((distance%(1000*60*60))/(1000*60));
const s=Math.floor((distance%(1000*60))/1000);

countdown.innerHTML="Empieza en: "+h+"h "+m+"m "+s+"s";

}

setInterval(updateCountdown,1000);
updateCountdown();

</script>

</body>
</html>
