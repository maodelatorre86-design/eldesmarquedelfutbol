<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pasto vs Santa Fe EN VIVO hoy ⚽ Millonarios vs Tolima</title>

<link rel="icon" href="EJEMPLO LOGO 2 (2).png">

<style>
body{margin:0;font-family:Arial;background:#0b0f19;color:white;}
header{background:#111a33;padding:14px;text-align:center;font-weight:800;font-size:18px}
.logo img{width:55px}
.container{max-width:1100px;margin:auto;padding:12px}

/* BANNERS */
.banner-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.banner{
position:relative;
aspect-ratio:16/9;
border-radius:14px;
overflow:hidden;
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
}

/* 🔥 CAPA OSCURA PARA CONTRASTE */
.banner::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.2));
}

/* 🔴 BADGE */
.badge{
position:absolute;
top:10px;
left:10px;
background:#333;
padding:6px 12px;
border-radius:6px;
font-size:12px;
font-weight:bold;
z-index:2;
}

.live{
background:red;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{opacity:1}
50%{opacity:.6}
100%{opacity:1}
}

/* 🔥 TEXTO MEJORADO */
.banner-text{
position:absolute;
bottom:12px;
left:12px;
z-index:2;
text-align:left;
}

/* TÍTULO */
.banner-text h3{
margin:0;
font-size:18px;
font-weight:900;
color:#fff;
text-shadow:0 2px 6px rgba(0,0,0,.9);
}

/* HORAS */
.banner-text p{
margin:3px 0;
font-size:14px;
font-weight:bold;
color:#fff;
text-shadow:0 2px 6px rgba(0,0,0,.9);
}

/* 🔥 CAJA DE HORAS */
.time-box{
display:inline-block;
background:rgba(0,0,0,.65);
padding:4px 8px;
border-radius:6px;
margin-top:4px;
}

/* CARDS */
.cards{
margin-top:15px;
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.card{
background:#111a33;
border-radius:12px;
padding:14px;
}

.boton{
display:block;
margin-top:10px;
background:#00d4ff;
color:#000;
padding:10px;
border-radius:8px;
text-align:center;
font-weight:bold;
text-decoration:none;
}

/* REPLAYS */
.replays{margin-top:25px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

.video-card{
background:#111a33;
border-radius:10px;
overflow:hidden;
cursor:pointer;
position:relative;
}

.video-card img{width:100%}

.play{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:24px;
background:rgba(0,0,0,.6);
padding:6px;
border-radius:50%;
}

/* MOBILE */
@media (max-width:600px){
.banner-grid{grid-template-columns:1fr}
.cards{grid-template-columns:1fr}

.banner-text h3{font-size:16px}
.banner-text p{font-size:13px}
}
</style>
</head>

<script>
const fechaEvento = new Date();
fechaEvento.setDate(fechaEvento.getDate()+1);

const pasto = new Date(fechaEvento);
pasto.setHours(17,30,0,0);

const millos = new Date(fechaEvento);
millos.setHours(19,45,0,0);

function actualizar(){
const now = new Date().getTime();

if(now >= pasto.getTime()){
document.getElementById("badge1").innerHTML="🔴 EN VIVO";
document.getElementById("badge1").classList.add("live");
}

if(now >= millos.getTime()){
document.getElementById("badge2").innerHTML="🔴 EN VIVO";
document.getElementById("badge2").classList.add("live");
}
}

setInterval(actualizar,1000);
</script>
