<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="title">EN VIVO | El Desmarque del Fútbol</title>

<link rel="icon" href="EJEMPLO LOGO 2 (2).png">

<style>
body{margin:0;font-family:Arial;background:#0b0f19;color:white;text-align:center}
header{background:#111a33;padding:18px;font-size:24px;font-weight:900}
.container{max-width:1100px;margin:auto;padding:20px}
.banner{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover}
.proxima{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
background:rgba(0,0,0,.65);padding:15px 25px;font-size:28px;font-weight:900;border-radius:12px}
.logo{position:absolute;top:15px;left:15px;background:rgba(0,0,0,.6);padding:10px;border-radius:10px}
.logo img{width:60px}
.tag{position:absolute;top:15px;right:15px;background:red;padding:8px 12px;border-radius:10px;font-weight:bold}
.card{margin-top:20px;background:#111a33;padding:20px;border-radius:14px}
.countdown{margin-top:15px;font-size:20px;font-weight:bold}
.player{display:none;margin-top:20px;aspect-ratio:16/9}
.player iframe{width:100%;height:100%;border:0}
</style>

</head>

<body>

<header>⚽ ELDESMARQUEDELFUTBOL — EN VIVO</header>

<div class="container">

<div id="prelive">

<div class="banner">
<img id="imagen">
<div class="proxima">PRÓXIMA TRANSMISIÓN</div>

<div class="logo">
<img src="EJEMPLO LOGO 2 (2).png">
</div>

<div class="tag" id="fecha"></div>

</div>

<div class="card">

<h2 id="equipos"></h2>

<p>🕕 Partido: <b id="horaPartido"></b></p>
<p>🎙️ Transmisión: <b id="horaTransmision"></b></p>

<div id="countdown" class="countdown"></div>

</div>

</div>

<div id="player" class="player">
<iframe id="iframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
</div>

</div>

<script>

const partido = {
  equipos: "DEPORTIVO CALI 🆚 SANTA FE",
  horaPartido: "8:30 PM",
  horaTransmision: "7:45 PM",
  fechaBanner: "HOY • 8:30 PM",
  imagen: "ESTADIO CALI.jpg",
  liveDate: "2026-03-17T19:45:00-05:00",
  facebook: "LINK_FACEBOOK_AQUI"
};

// Rellenar contenido
document.getElementById("equipos").innerText = partido.equipos;
document.getElementById("horaPartido").innerText = partido.horaPartido;
document.getElementById("horaTransmision").innerText = partido.horaTransmision;
document.getElementById("fecha").innerText = partido.fechaBanner;
document.getElementById("imagen").src = partido.imagen;
document.getElementById("title").innerText = partido.equipos + " EN VIVO | El Desmarque del Fútbol";

// Facebook player
document.getElementById("iframe").src =
"https://www.facebook.com/plugins/video.php?href=" + partido.facebook + "&show_text=false&autoplay=true&mute=0";

// Countdown
const liveDate = new Date(partido.liveDate).getTime();

function updateCountdown(){
const now = new Date().getTime();
const distance = liveDate - now;

if(distance <= 0){
document.getElementById("prelive").style.display="none";
document.getElementById("player").style.display="block";
return;
}

const h=Math.floor(distance/(1000*60*60));
const m=Math.floor((distance%(1000*60*60))/(1000*60));
const s=Math.floor((distance%(1000*60))/1000);

document.getElementById("countdown").innerHTML =
"Empieza en: "+h+"h "+m+"m "+s+"s";
}

setInterval(updateCountdown,1000);
updateCountdown();

</script>

</body>
</html>
