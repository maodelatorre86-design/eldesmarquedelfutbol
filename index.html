<body>

<header> ⚽ ELDESMARQUEDELFUTBOL — EN VIVO </header>

</div>

<div class="card">

<p>🕗 Partido: <b>8:20 PM</b></p>
<p>🎙️ Transmisión: <b>7:30 PM</b></p>

<!-- PLAYER SOLO SE ACTIVARÁ CUANDO PONGAS EL LINK -->
<div id="player" class="player">
<iframe id="liveFrame" src="" allowfullscreen></iframe>
</div>

</div>

<script>
// ⏱️ SOLO CONTADOR (NO CAMBIA A PLAYER AUTOMÁTICO)
const liveDate = new Date("2026-03-30T19:30:00-05:00").getTime();
const countdown=document.getElementById("countdown");

function updateCountdown(){
const now=new Date().getTime();
const distance=liveDate-now;

const h=Math.floor(distance/(1000*60*60));
const m=Math.floor((distance%(1000*60*60))/(1000*60));
const s=Math.floor((distance%(1000*60))/1000);

countdown.innerHTML="Empieza en: "+h+"h "+m+"m "+s+"s";
}

setInterval(updateCountdown,1000);
updateCountdown();


// 🎯 ACTIVACIÓN MANUAL DEL LIVE
// SOLO pega tu link aquí cuando empiece el partido
function activarLive(link){
document.getElementById("prelive").style.display="none";
const player=document.getElementById("player");
const frame=document.getElementById("liveFrame");

frame.src = link;
player.style.display="block";
}

/*
👉 CUANDO TENGAS EL LINK DE FACEBOOK O YOUTUBE:

Abre la consola del navegador (F12) y pega:

activarLive("AQUI_TU_LINK")

Ejemplo:
activarLive("https://www.facebook.com/plugins/video.php?href=TU_VIDEO")

*/
</script>

</body>
