<div class="container">

</div>

<div class="tag">HOY • 7:00 PM</div>
</div>

<div class="card">
<h2>O'HIGGINS 🆚 MILLONARIOS</h2>

<p>🏆 Copa Sudamericana</p>
<p>🕖 Partido: <b>7:00 PM</b></p>
<p>🎙️ Transmisión: <b>6:00 PM</b></p>

<div id="countdown" class="countdown"></div>

<a class="boton" href="/ohiggins-vs-millonarios-en-vivo.html">
VER PARTIDO
</a>
</div>

</div>

<script>
const liveDate = new Date();
liveDate.setHours(18,0,0,0); // 6:00 PM

const countdown=document.getElementById("countdown");

function updateCountdown(){
const now=new Date().getTime();
const distance=liveDate-now;

if(distance<=0){
countdown.innerHTML="🔴 EN VIVO AHORA";
return;
}

const h=Math.floor(distance/(1000*60*60));
const m=Math.floor((distance%(1000*60*60))/(1000*60));
const s=Math.floor((distance%(1000*60))/1000);

countdown.innerHTML="Empieza en: "+h+"h "+m+"m "+s+"s";
}

setInterval(updateCountdown,1000);
updateCountdown();
</script>

</body>
