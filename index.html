<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prueba transmisión en vivo | El Desmarque del Fútbol</title>

<link rel="icon" href="EJEMPLO LOGO 2 (2).png">

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#0b0f19;
color:white;
text-align:center;
}

header{
background:#111a33;
padding:18px;
font-size:24px;
font-weight:900;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.banner{
position:relative;
width:100%;
aspect-ratio:16/9;
overflow:hidden;
border-radius:14px;
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
}

.logo{
position:absolute;
top:15px;
left:15px;
background:rgba(0,0,0,.6);
padding:10px;
border-radius:10px;
}

.logo img{
width:60px;
}

.tag{
position:absolute;
top:15px;
right:15px;
background:red;
padding:8px 12px;
border-radius:10px;
font-weight:bold;
}

.player{
margin-top:20px;
aspect-ratio:16/9;
border-radius:14px;
overflow:hidden;
background:#000;
}

.player iframe{
width:100%;
height:100%;
border:0;
}

</style>

</head>

<body>

<header>
⚽ ELDESMARQUEDELFUTBOL — PRUEBA EN VIVO
</header>

<div class="container">

<div class="banner">

<img src="LA INDEPENDIENCIA CON MILLONARIOS.jpeg">

<div class="logo">
<img src="EJEMPLO LOGO 2 (2).png">
</div>

<div class="tag">
PRUEBA LIVE
</div>

</div>

<div class="player">

<iframe
src="https://www.youtube.com/embed/4yGHOjN5Xis?autoplay=1&mute=1&rel=0&modestbranding=1"
title="Transmisión en vivo"
allow="autoplay; encrypted-media; picture-in-picture"
allowfullscreen>
</iframe>

</div>

</div>

</body>
</html>
