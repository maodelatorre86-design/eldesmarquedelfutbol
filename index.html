<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pasto vs Santa Fe EN VIVO ⚽ Millonarios vs Tolima</title>

<link rel="icon" href="EJEMPLO LOGO 2 (2).png">

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#060b16;
color:white;
}

/* HEADER */
header{
background:#0c162b;
padding:15px;
text-align:center;
font-weight:bold;
}

/* CONTENEDOR */
.container{
max-width:1200px;
margin:auto;
padding:15px;
}

/* GRID */
.banner-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

/* TARJETA */
.banner{
position:relative;
border-radius:16px;
overflow:hidden;
aspect-ratio:16/9;
box-shadow:0 10px 25px rgba(0,0,0,.6);
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
}

/* OSCURECER */
.banner::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to bottom, rgba(0,0,0,.2), rgba(0,0,0,.95));
}

/* BADGE */
.badge{
position:absolute;
top:12px;
left:12px;
background:#e50914;
padding:6px 12px;
border-radius:6px;
font-size:12px;
font-weight:bold;
z-index:2;
}

/* TEXTO PRINCIPAL */
.banner-content{
position:absolute;
bottom:15px;
left:15px;
z-index:2;
}

/* EQUIPOS */
.match{
font-size:34px;
font-weight:900;
line-height:1;
}

.match span{
color:#ffb300;
}

/* HORAS */
.times{
margin-top:10px;
}

.time-row{
display:flex;
align-items:center;
gap:10px;
margin:6px 0;
}

.time-label{
font-size:12px;
opacity:.8;
}

.time-value{
font-size:22px;
font-weight:900;
color:#ffe600;
}

/* ICONO */
.icon{
width:28px;
height:28px;
background:red;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
}

/* REPLAYS */
.replays{
margin-top:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:12px;
}

.video-card{
background:#0f1b33;
border-radius:10px;
overflow:hidden;
cursor:pointer;
position:relative;
}

.video-card img{width:100%}

.play{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,.6);
padding:8px;
border-radius:50%;
}

/* MOBILE */
@media(max-width:700px){
.banner-grid{grid-template-columns:1fr}
.match{font-size:24px}
.time-value{font-size:18px}
}
</style>
</head>

<body>

<div>

</div>
</div>

</div>

</div>
</div>

<!-- PARTIDO 2 -->
<div class="banner">
