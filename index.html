<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Santa Fe vs Medellín EN VIVO | El Desmarque</title>

<link rel="icon" href="EJEMPLO LOGO 2 (2).png">

<style>

body{margin:0;font-family:Arial;background:#0b0f19;color:white;text-align:center}
header{background:#111a33;padding:18px;font-size:24px;font-weight:900}
.container{max-width:1100px;margin:auto;padding:20px}

.banner{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover}

.proxima{
position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,.65);
padding:15px 25px;font-size:28px;font-weight:900;border-radius:12px}

.logo{
position:absolute;top:15px;left:15px;
background:rgba(0,0,0,.6);
padding:10px;border-radius:10px}

.logo img{width:60px}

.tag{
position:absolute;top:15px;right:15px;
background:red;padding:8px 12px;border-radius:10px;font-weight:bold}

.card{margin-top:20px;background:#111a33;padding:20px;border-radius:14px}
.countdown{margin-top:15px;font-size:20px;font-weight:bold}

@media (max-width:600px){
.proxima{font-size:18px;padding:10px 15px;}
}

</style>

</head>

<body>

<header>⚽ ELDESMARQUEDELFUTBOL — EN VIVO</header>

<div class="container">

<div class="banner">
<img src="EL CAMPIN SANTA FE.jpg">

<div class="proxima">PRÓXIMA TRANSMISIÓN</div>

<div class="logo">
<img src="EJEMPLO LOGO 2 (2).png">
</div>

<div class="tag">LUNES • 4:10 PM</div>

</div>

<div class="card">

<h2>SANTA FE 🆚 MEDELLÍN</h2>

<p>📍 Bogotá</p>
<p>🕕 Partido: <b>4:10 PM</b></p>
<p>🎙️ Transmisión: <b>3:30 PM</b></p>

<div id="countdown" class="countdown"></div>

</div>

</div>

<script>

const liveDate = new Date("2026-03-23T15:30:00-05:00").getTime();
const startingSoon = liveDate - (5 * 60 * 1000);

const countdown=document.getElementById("countdown");

function updateCountdown(){

const now=new Date().getTime();
const distance=liveDate-now;

if(now >= startingSoon && now < liveDate){
countdown.innerHTML="🔴 TRANSMISIÓN INICIANDO...";
return;
}

if(distance<=0){
return;
}

const h=Math.floor(distance/(1000*60*60));
const m=Math.floor((distance%(1000*60*60))/(1000*60));
const s=Math.floor((distance%(1000*60))/1000);

countdown.innerHTML="Empieza en: "+h+"h "+m+"m "+s+"s";

}

setInterval(updateCountdown,1000);
updateCountdown();

</script>

</body>
</html>
