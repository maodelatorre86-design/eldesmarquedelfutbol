<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pasto vs Santa Fe EN VIVO ⚽ Millonarios vs Tolima</title>

<link rel="icon" href="EJEMPLO LOGO 2 (2).png">

<style>
body{
margin:0;
font-family:Arial;
background:#060b16;
color:white;
}

header{
background:#0c162b;
padding:15px;
text-align:center;
font-weight:bold;
}

.container{
max-width:1200px;
margin:auto;
padding:15px;
}

.banner-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

/* BANNER */
.banner{
position:relative;
border-radius:16px;
overflow:hidden;
aspect-ratio:16/9;
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
}

/* 🔥 overlay corregido */
.banner::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to bottom, rgba(0,0,0,.2), rgba(0,0,0,.95));
pointer-events:none;
}

.banner-content{
position:absolute;
bottom:15px;
left:15px;
z-index:2;
}

.match{
font-size:30px;
font-weight:900;
}

.match span{
color:#ffb300;
}

.time{
font-size:20px;
color:#ffe600;
font-weight:900;
}

/* BOTÓN */
.banner-btn{
position:absolute;
bottom:15px;
right:15px;
z-index:3;
background:#e50914;
padding:10px;
border-radius:8px;
color:white;
text-decoration:none;
font-weight:bold;
}

</style>
</head>

<body>

<header>⚽ EL DESMARQUE DEL FÚTBOL</header>

<div class="container">

<div class="banner-grid">

<!-- PARTIDO 1 -->
<div class="banner">
<img src="Estadio-Libertad-Pasto.jpg">

<div class="banner-content">
<div class="match">PASTO <span>VS</span> SANTA FE</div>
<div class="time">5:30 PM / 6:00 PM</div>
</div>

<a class="banner-btn" href="./pasto-vs-santafe-en-vivo.html">
VER PARTIDO
</a>

</div>

<!-- PARTIDO 2 -->
<div class="banner">
<img src="ESTADIO MILLONARIOS 1.JPG">

<div class="banner-content">
<div class="match">MILLONARIOS <span>VS</span> TOLIMA</div>
<div class="time">8:00 PM</div>
</div>

<a class="banner-btn" href="./millonarios-vs-tolima-en-vivo.html">
VER PARTIDO
</a>

</div>

</div>

</div>

</body>
</html>
