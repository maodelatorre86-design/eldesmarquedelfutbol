<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pasto vs Santa Fe EN VIVO</title>

<style>
body{
margin:0;
font-family:Arial;
background:#060b16;
color:white;
}

header{
background:#0c162b;
padding:15px;
text-align:center;
font-weight:bold;
}

.container{
max-width:1000px;
margin:auto;
padding:15px;
}

/* BANNER */
.banner{
position:relative;
border-radius:16px;
overflow:hidden;
}

.banner img{
width:100%;
height:auto;
display:block;
}

.banner-content{
position:absolute;
bottom:15px;
left:15px;
}

.match{
font-size:28px;
font-weight:900;
}

.match span{
color:#ffb300;
}

.time{
font-size:18px;
color:#ffe600;
font-weight:bold;
}

/* PLAYER */
.player{
margin-top:20px;
}

.player iframe{
width:100%;
height:500px; /* 🔥 CLAVE */
border:none;
border-radius:12px;
}
</style>
</head>

<body>

<header>⚽ EL DESMARQUE DEL FÚTBOL</header>

<div class="container">

<div class="banner">
<img src="Estadio-Libertad-Pasto.jpg">

<div class="banner-content">
<div class="match">PASTO <span>VS</span> SANTA FE</div>
<div class="time">5:30 PM / 6:00 PM</div>
</div>
</div>

<!-- 🔥 EMBED LIMPIO -->
<div class="player">
<iframe 
src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/100063705559520/videos/1247135337187690"
allowfullscreen>
</iframe>
</div>

</div>

</body>
</html>
