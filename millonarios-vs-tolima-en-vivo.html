<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Millonarios vs Tolima EN VIVO</title>

<link rel="icon" href="EJEMPLO LOGO 2 (2).png">

<style>
body{
margin:0;
font-family:Arial;
background:#060b16;
color:white;
}

header{
background:#0c162b;
padding:15px;
text-align:center;
font-weight:bold;
}

.container{
max-width:1000px;
margin:auto;
padding:15px;
}

/* BANNER */
.banner{
position:relative;
border-radius:16px;
overflow:hidden;
aspect-ratio:16/9;
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
}

.banner::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to bottom, rgba(0,0,0,.2), rgba(0,0,0,.95));
}

.banner-content{
position:absolute;
bottom:15px;
left:15px;
z-index:2;
}

.match{
font-size:30px;
font-weight:900;
}

.match span{
color:#ffb300;
}

.time{
font-size:20px;
color:#ffe600;
font-weight:900;
margin-top:6px;
}

/* PLAYER */
.player{
margin-top:15px;
aspect-ratio:16/9;
}

.player iframe{
width:100%;
height:100%;
border-radius:12px;
border:0;
}

/* BOTÓN */
.boton{
display:block;
margin-top:15px;
background:#00d4ff;
color:#000;
padding:10px;
border-radius:8px;
text-align:center;
font-weight:bold;
text-decoration:none;
}
</style>
</head>

<body>

<header>⚽ EL DESMARQUE DEL FÚTBOL</header>

<div class="container">

<!-- 🔥 BANNER -->
<div class="banner">
<img src="ESTADIO MILLONARIOS 1.JPG">

<div class="banner-content">
<div class="match">MILLONARIOS <span>VS</span> TOLIMA</div>
<div class="time">🕗 8:00 PM</div>
</div>

</div>

<!-- 🎥 PLAYER CORREGIDO -->
<div class="player">
<iframe 
src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/100063705559520/videos/4343377415807998&show_text=false&width=100%" 
width="100%" 
height="100%" 
style="border:none;overflow:hidden" 
scrolling="no" 
frameborder="0" 
allowfullscreen="true">
</iframe>
</div>

<a class="boton" href="/">⬅ Volver al inicio</a>

</div>

</body>
</html>
