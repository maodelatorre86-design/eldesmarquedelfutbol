}

.container{
max-width:1100px;
margin:auto;

/* BLOQUE PRINCIPAL */
.banner-main{
display:grid;
grid-template-columns:1.1fr 1fr;
gap:12px;

}

}

}

.badge{

}

.match{

font-weight:900;
}

.match span{color:#ffb300;}

.time{

color:#ffe600;
font-weight:bold;
margin-top:6px;
}

.extra{
margin-top:8px;
font-size:13px;
opacity:.9;
}

.fecha{
margin-top:6px;
font-size:13px;
color:#aaa;
}

/* PLAYER */
.player{
margin-top:20px;
}

.player iframe{
width:100%;
height:520px;
border:none;
border-radius:12px;
background:black;
}

/* BOTÓN */
.btn{
display:inline-block;
margin-top:12px;
background:#00d4ff;
padding:10px;
border-radius:8px;
color:#000;
text-decoration:none;
font-weight:bold;
}

@media(max-width:700px){
.banner-main{grid-template-columns:1fr;}
.player iframe{height:300px;}
}
</style>
</head>
